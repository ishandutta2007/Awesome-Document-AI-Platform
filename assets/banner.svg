<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31103f"/>
    </linearGradient>

    <!-- Card Glassmorphism Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
    }
    .flow-line {
      stroke: #818cf8;
      stroke-width: 2;
      stroke-dasharray: 6 6;
      animation: dash 20s linear infinite;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -100;
      }
    }
    .pulse-circle {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(0.98); opacity: 0.4; }
      100% { transform: scale(1.02); opacity: 0.8; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)"/>

  <!-- Dynamic Animated Background Mesh / Flow Elements (Placed strictly behind background graphics) -->
  <g opacity="0.3">
    <!-- Glowing background orbs -->
    <circle cx="150" cy="80" r="120" fill="#4f46e5" filter="url(#softGlow)" class="pulse-circle"/>
    <circle cx="1050" cy="260" r="140" fill="#c026d3" filter="url(#softGlow)" class="pulse-circle"/>
    <circle cx="850" cy="70" r="90" fill="#06b6d4" filter="url(#softGlow)"/>

    <!-- Document Processing Pipeline Flow Visualization (Background Graphic Right Side) -->
    <!-- Document Card 1: Unstructured PDF -->
    <rect x="740" y="80" width="100" height="130" rx="8" fill="url(#glassGrad)" stroke="#64748b" stroke-width="1.5"/>
    <line x1="760" y1="105" x2="820" y2="105" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="760" y1="125" x2="810" y2="125" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="760" y1="140" x2="815" y2="140" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="760" y1="155" x2="795" y2="155" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

    <!-- Connecting Flow Vector 1 -->
    <path d="M 850 145 Q 880 145 900 145" fill="none" class="flow-line"/>
    <polygon points="898,140 908,145 898,150" fill="#818cf8"/>

    <!-- AI Core Engine Node -->
    <rect x="910" y="110" width="80" height="70" rx="12" fill="#1e1b4b" stroke="url(#accentGrad)" stroke-width="2" filter="url(#glow)"/>
    <text x="950" y="142" font-family="sans-serif" font-weight="bold" font-size="14" fill="#a855f7" text-anchor="middle">AI / VLM</text>
    <text x="950" y="160" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">OCR Core</text>

    <!-- Connecting Flow Vector 2 -->
    <path d="M 1000 145 Q 1020 145 1040 145" fill="none" class="flow-line"/>
    <polygon points="1038,140 1048,145 1038,150" fill="#ec4899"/>

    <!-- Document Card 2: Structured JSON Data -->
    <rect x="1050" y="80" width="110" height="130" rx="8" fill="url(#glassGrad)" stroke="#10b981" stroke-width="1.5"/>
    <text x="1065" y="108" font-family="monospace" font-size="12" fill="#34d399">{ "data":</text>
    <text x="1075" y="128" font-family="monospace" font-size="11" fill="#f472b6">"invoice":</text>
    <text x="1075" y="146" font-family="monospace" font-size="11" fill="#fbbf24">$1,250</text>
    <text x="1065" y="170" font-family="monospace" font-size="12" fill="#34d399">}</text>

    <!-- Stats & Tech Pill Badges at Bottom Right -->
    <g transform="translate(740, 245)">
      <rect x="0" y="0" width="120" height="34" rx="17" fill="#1e293b" stroke="#334155"/>
      <text x="60" y="22" class="badge-text" text-anchor="middle">📄 IDP &amp; OCR</text>

      <rect x="135" y="0" width="135" height="34" rx="17" fill="#1e293b" stroke="#334155"/>
      <text x="202" y="22" class="badge-text" text-anchor="middle">⚡ VLM Parsing</text>

      <rect x="285" y="0" width="130" height="34" rx="17" fill="#1e293b" stroke="#334155"/>
      <text x="350" y="22" class="badge-text" text-anchor="middle">🚀 Open Source</text>
    </g>
  </g>

  <!-- Foreground Content (Text & Title - Guaranteed 100% visible and un-obscured) -->
  <!-- Top Category Tag -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="url(#accentGrad)"/>
    <text x="110" y="21" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#ffffff" letter-spacing="1.5" text-anchor="middle">AWESOME ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="138" class="title" filter="url(#glow)">Awesome Document AI Platform</text>

  <!-- Subtitle -->
  <text x="60" y="180" class="subtitle">Curated Intelligent Document Processing, VLM Parsers &amp; OCR Platforms</text>

  <!-- Key Metrics / Pillars Line -->
  <g transform="translate(60, 230)">
    <circle cx="10" cy="10" r="5" fill="#10b981"/>
    <text x="25" y="15" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#94a3b8">Enterprise SaaS</text>

    <circle cx="170" cy="10" r="5" fill="#a855f7"/>
    <text x="185" y="15" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#94a3b8">Vision-Language Models</text>

    <circle cx="390" cy="10" r="5" fill="#ec4899"/>
    <text x="405" y="15" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#94a3b8">Structured Data Extraction</text>
  </g>

  <!-- Gradient Accent Bar at bottom edge -->
  <rect x="0" y="332" width="1200" height="8" rx="4" fill="url(#accentGrad)"/>
</svg>
